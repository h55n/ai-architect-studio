name: CI — AI Architect Studio

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-typecheck:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Use a dummy key for CI — no real API calls in build
          MISTRAL_API_KEY: "ci-placeholder-key"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
